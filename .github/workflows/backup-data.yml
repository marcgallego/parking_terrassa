# Còpia diària de les dades fora de Cloudflare: cada matinada baixa el CSV
# del dia anterior, el desa a la branca `data` d'aquest repositori i hi torna a
# muntar el CSV del mes, que és el que serveix /data/AAAA-MM.csv. Si la branca
# no existeix, la crea.
name: Còpia diària de les dades

on:
  schedule:
    - cron: "20 1 * * *"   # 01:20 UTC = 02:20/03:20 hora local, ja passat mitjanit
  workflow_dispatch:
    inputs:
      day:
        description: "Dia a copiar (AAAA-MM-DD); per defecte, ahir"
        required: false
      until:
        description: "Últim dia a copiar (AAAA-MM-DD), per recuperar tots els dies des de `day`; per defecte, només `day`"
        required: false

permissions:
  contents: write

# Totes les execucions escriuen a la mateixa branca: si n'anessin dues alhora,
# el push de la segona fallaria. Així, una execució manual espera l'altra.
concurrency:
  group: backup-data
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # No es fa el checkout de `data` directament: si la branca no existeix (la
      # primera vegada, en un fork o si s'ha esborrat), el checkout falla cada dia.
      - uses: actions/checkout@v4

      - name: Passa a la branca data
        run: |
          set -euo pipefail
          # Amb --exit-code, 2 vol dir que la branca no hi és. Un error de xarxa o
          # de permisos dóna un altre codi i no s'ha de prendre per una branca buida.
          rc=0
          git ls-remote --exit-code origin refs/heads/data > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data
            git switch -c data origin/data
          elif [ "$rc" -eq 2 ]; then
            echo "::warning::la branca data no existeix i es crea de nou; els dies anteriors s'hi copien a mà, amb day i until"
            # Sense historial i sense el codi: --orphan treu tots els fitxers seguits.
            git switch --orphan data
            cat > README.md <<'EOF'
          # Còpia diària de les dades

          Aquesta branca només conté els CSV d'ocupació dels pàrquings Saba de Terrassa,
          copiats cada matinada des de https://parking.terrassa.workers.dev per una GitHub Action.
          Estructura: `data/AAAA/AAAA-MM-DD.csv`, un per dia, i `data/AAAA/AAAA-MM.csv`, el mes sencer.
          Esquema i llicència (CC BY 4.0): vegeu la branca `main`.
          EOF
            git add README.md
          else
            echo "::error::no s'ha pogut consultar la branca data (git ls-remote ha acabat amb $rc)"
            exit "$rc"
          fi

      - name: Baixa els CSV diaris
        env:
          DAY: ${{ github.event.inputs.day }}
          UNTIL: ${{ github.event.inputs.until }}
        run: |
          set -euo pipefail
          first="${DAY:-$(TZ=Europe/Madrid date -d "yesterday" +%F)}"
          last="${UNTIL:-$first}"
          for d in "$first" "$last"; do
            # El format i, a més, que el dia existeixi: 2026-02-30 no passa.
            [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$(date -u -d "$d" +%F 2>/dev/null)" == "$d" ]] \
              || { echo "::error::dia no vàlid: $d"; exit 1; }
          done
          [[ ! "$first" > "$last" ]] || { echo "::error::until ($last) és anterior a day ($first)"; exit 1; }
          # D'un dia que encara no s'ha acabat només se'n copiaria un tros.
          [[ "$last" < "$(TZ=Europe/Madrid date +%F)" ]] || { echo "::error::$last encara no s'ha acabat"; exit 1; }
          d="$first"
          while [[ ! "$d" > "$last" ]]; do
            dir="data/${d:0:4}"
            mkdir -p "$dir"
            curl -fsS --retry 3 "https://parking.terrassa.workers.dev/data/$d.csv" -o "$dir/$d.csv"
            lines=$(wc -l < "$dir/$d.csv")
            echo "$d: $lines línies"
            if [ "$lines" -le 1 ]; then echo "::error::el CSV de $d no té dades"; exit 1; fi
            d=$(date -u -d "$d + 1 day" +%F)
          done
          echo "FIRST_DAY=$first" >> "$GITHUB_ENV"
          echo "LAST_DAY=$last" >> "$GITHUB_ENV"

      # El Worker no pot generar el CSV d'un mes sencer (~130.000 files): supera
      # els 10 ms de CPU del pla gratuït. Es munta aquí amb els CSV diaris, i
      # /data/AAAA-MM.csv el passa tal com és.
      - name: Munta el CSV del mes
        run: |
          set -euo pipefail
          header=$(head -n 1 "data/${LAST_DAY:0:4}/$LAST_DAY.csv")
          # Cada mes que toca l'interval; en la còpia diària, només el d'ahir.
          month="${FIRST_DAY:0:7}"
          while [[ ! "$month" > "${LAST_DAY:0:7}" ]]; do
            dir="data/${month:0:4}"
            # Capçalera una sola vegada i els dies en ordre. El patró `-??` deixa
            # fora el mateix fitxer del mes (AAAA-MM.csv).
            files=("$dir/$month"-??.csv)
            tmp=$(mktemp)
            printf '%s\n' "$header" > "$tmp"
            for f in "${files[@]}"; do
              if [ "$(head -n 1 "$f")" != "$header" ]; then
                echo "::error::$f té una capçalera diferent de la de $LAST_DAY.csv"
                exit 1
              fi
              tail -n +2 "$f" >> "$tmp"
            done
            mv "$tmp" "$dir/$month.csv"
            echo "$month: ${#files[@]} dies, $(wc -l < "$dir/$month.csv") línies"
            # Un dia sense còpia deixaria un forat al mes sense que res fallés.
            d=$(basename "${files[0]}" .csv)
            last=$(basename "${files[${#files[@]}-1]}" .csv)
            while [ "$d" != "$last" ]; do
              [ -f "$dir/$d.csv" ] || echo "::warning::falta $d.csv: $month.csv hi tindrà un forat"
              d=$(date -u -d "$d + 1 day" +%F)
            done
            month=$(date -u -d "$month-01 + 1 month" +%Y-%m)
          done

      - name: Commit i push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "res a canviar"; exit 0; }
          git commit -m "data: $(git diff --cached --name-only | xargs -n1 basename | tr '\n' ' ')"
          # Sense --force: si algú ha tocat la branca mentrestant, el push falla
          # en lloc de trepitjar-la.
          git push origin HEAD:refs/heads/data
